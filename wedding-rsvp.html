<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Wedding Invitation</title>
    
    <!-- Google Fonts: Prompt (Thai) & Playfair Display (English/Headings) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Config for Wedding Theme (Ocean Blue Edition) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        'wedding-sand': '#C5A059',  /* สีทองทราย */
                        'wedding-mist': '#E0F7FA',  /* สีฟ้าอ่อน (พื้นหลัง) */
                        'wedding-ocean': '#0891B2', /* สีฟ้าน้ำทะเล (สีหลัก) */
                        'wedding-text': '#4A4A4A',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #0891B2;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-wedding-mist/50 min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- Desktop Card Container (Wide) -->
    <div class="bg-white w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row h-auto md:h-[85vh] relative">
        
        <!-- Left Side: Visuals (Image & Logo) -->
        <div class="w-full md:w-5/12 relative h-48 md:h-auto bg-gray-200 group overflow-hidden">
            <!-- Overlay Gradient -->
            <div class="absolute inset-0 bg-black/30 z-10 transition-opacity duration-700 group-hover:bg-black/20"></div>
            
            <!-- Background Image (ใช้รูปธีมทะเลเหมือนกัน) -->
            <img src="./gallery/DSC04958.jpg" 
                 alt="Wedding RSVP" 
                 class="w-full h-full object-cover object-[center_40%] transition-transform duration-1000 group-hover:scale-105">
            
            <!-- Centered Content on Image -->
            <div class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 text-center">
                <!-- Logo -->
                <img src="./image/MBR2505-037-09.png" 
                     alt="Wedding Logo" 
                     class="w-auto h-10 md:h-12 object-contain drop-shadow-lg mb-4 transform transition hover:scale-105 duration-300"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                
                <h1 class="font-serif text-3xl font-bold tracking-wider drop-shadow-md text-white hidden">Wedding RSVP</h1>
                
                <div class="hidden md:block text-white/90 font-serif italic mt-4 text-lg">
                    "Please be our guest"
                </div>
            </div>
        </div>

        <!-- Right Side: Content & Form (Scrollable) -->
        <div class="w-full md:w-7/12 flex flex-col h-full bg-white relative">
            <!-- Decorative Top Line for Mobile only -->
            <div class="h-2 w-full bg-wedding-ocean md:hidden"></div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto no-scrollbar p-6 md:p-10">
                
                <!-- Header Text -->
                <div class="text-center md:text-left mb-8 md:mb-10 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                    <div>
                        <h2 class="font-serif text-3xl md:text-4xl text-wedding-ocean font-bold">RSVP</h2>
                        <div class="w-16 h-1 bg-wedding-sand mt-2 rounded-full mx-auto md:mx-0"></div>
                        <p class="text-gray-500 text-sm mt-2">แบบฟอร์มยืนยันการเข้าร่วมงาน</p>
                    </div>
                    <p class="text-gray-400 text-xs md:text-sm font-light">#KobYingWeddingDay2026</p>
                </div>

                <!-- RSVP Form -->
                <form id="rsvpForm" class="space-y-6">
                    
                    <!-- ชื่อ-นามสกุล -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">ชื่อ-นามสกุล (Name)</label>
                        <input type="text" name="name" required placeholder="ระบุชื่อ-นามสกุลของท่าน"
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-wedding-ocean focus:ring-2 focus:ring-wedding-ocean/20 outline-none transition text-sm">
                    </div>

                    <!-- สถานะการเข้าร่วม -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-3">สถานะการเข้าร่วม (Attendance)</label>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="cursor-pointer relative">
                                <input type="radio" name="attendance" value="เข้าร่วมงาน" class="peer sr-only" required onchange="toggleGuestFields(true)">
                                <div class="p-4 rounded-xl border-2 border-gray-100 bg-white text-center hover:bg-gray-50 transition peer-checked:border-wedding-ocean peer-checked:bg-wedding-mist/50">
                                    <div class="text-2xl mb-1">🎉</div>
                                    <span class="font-medium text-gray-700 peer-checked:text-wedding-ocean">ยินดีเข้าร่วมงาน</span>
                                </div>
                                <div class="absolute top-2 right-2 text-wedding-ocean opacity-0 peer-checked:opacity-100 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                                </div>
                            </label>
                            
                            <label class="cursor-pointer relative">
                                <input type="radio" name="attendance" value="ไม่สามารถเข้าร่วมได้" class="peer sr-only" onchange="toggleGuestFields(false)">
                                <div class="p-4 rounded-xl border-2 border-gray-100 bg-white text-center hover:bg-gray-50 transition peer-checked:border-red-400 peer-checked:bg-red-50">
                                    <div class="text-2xl mb-1">💌</div>
                                    <span class="font-medium text-gray-700 peer-checked:text-red-500">ไม่สะดวกเข้าร่วม</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- ส่วนข้อมูลเพิ่มเติม (ซ่อนถ้าไม่มา) -->
                    <div id="additionalFields" class="space-y-6 transition-all duration-300 overflow-hidden max-h-[1000px]">
                        
                        <div class="grid md:grid-cols-2 gap-6">
                            <!-- จำนวนผู้เข้าร่วม -->
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">จำนวนผู้เข้าร่วม (Guests)</label>
                                <select name="guests" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-wedding-ocean focus:ring-2 focus:ring-wedding-ocean/20 outline-none transition text-sm appearance-none cursor-pointer">
                                    <option value="1">1 ท่าน</option>
                                    <option value="2">2 ท่าน</option>
                                    <option value="3">3 ท่าน</option>
                                    <option value="4">4 ท่าน</option>
                                    <option value="5">5 ท่าน</option>
                                </select>
                            </div>

                            <!-- ข้อจำกัดด้านอาหาร -->
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">แพ้อาหาร / อาหารที่ทานไม่ได้</label>
                                <input type="text" name="food" placeholder="เช่น แพ้กุ้ง, ไม่ทานเนื้อวัว (ถ้ามี)"
                                       class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-wedding-ocean focus:ring-2 focus:ring-wedding-ocean/20 outline-none transition text-sm">
                            </div>
                        </div>

                    </div>

                    <!-- คำอวยพร -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">คำอวยพร (Wishes)</label>
                        <textarea name="wishes" rows="3" placeholder="ฝากคำอวยพรถึงบ่าวสาว..."
                                  class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-wedding-ocean focus:ring-2 focus:ring-wedding-ocean/20 outline-none transition text-sm resize-none"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-2">
                        <button type="submit" id="submitBtn" 
                                class="w-full bg-wedding-ocean hover:bg-cyan-700 text-white font-medium py-3 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                            <span>ส่งแบบตอบรับ</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                        </button>
                    </div>
                </form>
                
                <!-- Footer Mobile -->
                <div class="mt-8 text-center md:hidden">
                    <p class="font-serif text-wedding-sand text-lg italic">Thank you</p>
                </div>

            </div>
            
            <!-- Desktop Footer -->
            <div class="hidden md:block absolute bottom-0 right-0 p-4 bg-white/90 backdrop-blur rounded-tl-xl text-right">
                <p class="font-serif text-wedding-sand italic text-sm">Thank you for being part of our day</p>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="font-serif text-xl font-bold text-gray-800 mb-2">บันทึกข้อมูลสำเร็จ</h3>
            <p class="text-gray-500 text-sm mb-6">ขอบคุณที่ร่วมเป็นส่วนหนึ่งในวันสำคัญของเราครับ/ค่ะ</p>
            <button onclick="closeModal()" class="w-full bg-gray-800 text-white py-2.5 rounded-lg text-sm hover:bg-gray-900 transition">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        // Toggle Fields based on Attendance
        function toggleGuestFields(isJoining) {
            const fields = document.getElementById('additionalFields');
            const inputs = fields.querySelectorAll('input, select');
            
            if (isJoining) {
                fields.style.maxHeight = '1000px';
                fields.style.opacity = '1';
                fields.classList.remove('pointer-events-none');
                // Re-enable inputs
                inputs.forEach(input => input.disabled = false);
            } else {
                fields.style.maxHeight = '0px';
                fields.style.opacity = '0';
                fields.classList.add('pointer-events-none');
                // Disable inputs to prevent validation issues if any
                inputs.forEach(input => input.disabled = true);
            }
        }

        const RSVP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzbPx8FVMjydFJ3yYWgmLPgVp4HmBDh0bNbj08iPcYGXI89fmnb9W4k_89kN7Sm-Pl/exec';

        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalBtnText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div><span class="ml-2">กำลังบันทึก...</span>';
            
            const formData = new FormData(this);
            
            // Construct Payload match with Google Sheet Columns
            // 'วันที่/เวลา', 'ชื่อ-นามสกุล', 'สถานะการเข้าร่วม', 'จำนวนผู้เข้าร่วม', 'ข้อจำกัดด้านอาหาร', 'คำอวยพร'
            const payload = {
                timestamp: new Date().toISOString(), // วันที่/เวลา
                name: formData.get('name'),          // ชื่อ-นามสกุล
                status: formData.get('attendance'),  // สถานะการเข้าร่วม
                guests: formData.get('attendance') === 'เข้าร่วมงาน' ? formData.get('guests') : '0', // จำนวนผู้เข้าร่วม
                food: formData.get('attendance') === 'เข้าร่วมงาน' ? (formData.get('food') || '-') : '-',     // ข้อจำกัดด้านอาหาร
                wishes: formData.get('wishes') || '-'       // คำอวยพร
            };

            fetch(RSVP_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                showSuccessModal(btn, originalBtnText);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            });
        });

        function showSuccessModal(btn, originalBtnText) {
            btn.disabled = false;
            btn.innerHTML = originalBtnText;
            
            const modal = document.getElementById('successModal');
            modal.classList.remove('hidden', 'flex');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
            
            document.getElementById('rsvpForm').reset();
            // Reset to default state (showing fields)
            toggleGuestFields(true);
        }

        function closeModal() {
            const modal = document.getElementById('successModal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }
    </script>
</body>
</html>
